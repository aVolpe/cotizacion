spring:

  flyway:
    enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange

  jpa:
    hibernate:
      ddl-auto: validate

  web:
    resources:
      static-locations: classpath:/public/

# the base application.yml logs the web requests in debug, useful in development only
logging:
  level:
    web: info
